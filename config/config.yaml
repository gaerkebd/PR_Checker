# ── RAG ──────────────────────────────────────────────────────────────────────
rag:
  top_k: 8                           # total retrieved chunks per query
  collection_name: "security_rules"
  use_mmr: true                      # Maximal Marginal Relevance for diverse retrieval
  mmr_lambda: 0.6                    # 1.0 = pure relevance, 0.0 = pure diversity
