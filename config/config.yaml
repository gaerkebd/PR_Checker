# ── GitHub Data Collection ──────────────────────────────────────────────────
github:
  repo: "nodejs/node
  "  # owner/repo to pull PRs from
  max_prs: 500                       # cap for data collection
  min_review_comments: 1             # filter: skip PRs with fewer comments
  state: "closed"                    # "open" | "closed" | "all"

# ── BigVul Dataset (HuggingFace) ─────────────────────────────────────────────
bigvul:
  dataset_id: "bstee615/bigvul"      # HuggingFace dataset repo ID
  split: "train"                     # "train" | "test" | "validation"
  max_records: 5000                  # cap on records to load (null = all)

# ── Paths ───────────────────────────────────────────────────────────────────
# Per-repo paths (raw_data … vulnerability_accuracy) are auto-built at runtime
# from github.repo (e.g. "pytorch/pytorch" → data/raw/pytorch/pytorch/…).
# Edit github.repo above — do not edit these file paths directly.
# chroma_db and knowledge_base are shared across all repos.
paths:
  raw_data: "data/raw/org/repo/prs_raw.json"
  processed_data: "data/processed/org/repo/prs_processed.json"
  bigvul_data: "data/processed/bigvul/bigvul_records.json"
  baseline_results: "data/processed/org/repo/baseline_results.json"
  rag_results: "data/processed/org/repo/rag_results.json"
  evaluation_results: "data/processed/org/repo/evaluation_results.json"
  vulnerability_accuracy: "data/processed/org/repo/vulnerability_accuracy.json"
  chroma_db: "data/chroma_db"
  knowledge_base: "data/knowledge_base"  # folder for OWASP / coding rule docs

# ── LLM ─────────────────────────────────────────────────────────────────────
llm:
  provider: "gemini"
  model: "gemini-3.1-flash-lite-preview"     # generous free tier: 30 RPM, 1500 RPD
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  temperature: 0.2
  max_tokens: 1500

ollama:
  model: "qwen2.5-coder:1.5b"     # generous free tier: 30 RPM, 1500 RPD
  base_url: "http://127.0.0.1:11434/api/generate"
  stream: false

## -d '{
##  "model": "qwen2.5-coder:1.5b",
   ##"prompt": "Write a hello world script in Python.",
   ##"stream": false
 ##}'


# ── Embeddings ───────────────────────────────────────────────────────────────
embeddings:
  model: "gemini-embedding-001" # Google Generative AI embedding model
  chunk_size: 1000
  chunk_overlap: 100

# ── RAG ──────────────────────────────────────────────────────────────────────
rag:
  top_k: 5                           # number of retrieved chunks per query
  collection_name: "security_rules"
